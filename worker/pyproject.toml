[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedids-worker"
version = "0.1.0"
description = "Python worker: federation simulation, attacks, defenses"
requires-python = ">=3.11"
dependencies = [
  "protobuf>=5",
  "pyarrow>=15",
  "numpy>=1.26",
]

[project.optional-dependencies]
fl = ["flwr[simulation]>=1.8", "torch>=2.2"]
dev = ["pytest>=8", "grpcio-tools>=1.60"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
